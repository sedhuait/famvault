<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bgRose" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#1C1518"/>
      <stop offset="100%" stop-color="#09080A"/>
    </radialGradient>
    <!-- 18K Rose Gold outer frame -->
    <linearGradient id="roseOuter" gradientUnits="userSpaceOnUse" x1="210" y1="318" x2="814" y2="762">
      <stop offset="0%" stop-color="#FCE3DD"/>
      <stop offset="45%" stop-color="#E5A193"/>
      <stop offset="100%" stop-color="#B56558"/>
    </linearGradient>
    <!-- Brushed Rose Gold girdle -->
    <linearGradient id="roseGirdle" gradientUnits="userSpaceOnUse" x1="210" y1="446" x2="814" y2="446">
      <stop offset="0%" stop-color="#F7D7CF"/>
      <stop offset="50%" stop-color="#DD9486"/>
      <stop offset="100%" stop-color="#B86B5E"/>
    </linearGradient>
    <!-- Soft Rose Gold inner facets -->
    <linearGradient id="roseInner" gradientUnits="userSpaceOnUse" x1="312" y1="318" x2="712" y2="762">
      <stop offset="0%" stop-color="#F9DDD6"/>
      <stop offset="50%" stop-color="#D78E7F"/>
      <stop offset="100%" stop-color="#A85C50"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bgRose)"/>
  <!-- Delicate secondary inner facets -->
  <line x1="512" y1="318" x2="512" y2="762"
        stroke="url(#roseInner)" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>
  <polyline points="406,318 305,446 512,762 719,446 618,318"
            fill="none" stroke="url(#roseInner)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.65"/>
  <polyline points="305,446 445,572 512,508 579,572 719,446"
            fill="none" stroke="url(#roseInner)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  <!-- Primary inner diamond facets -->
  <polyline points="400,446 512,318 624,446"
            fill="none" stroke="url(#roseInner)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <polyline points="312,318 400,446 512,762 624,446 712,318"
            fill="none" stroke="url(#roseInner)" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.88"/>
  <!-- Girdle line -->
  <polyline points="210,446 814,446" fill="none" stroke="url(#roseGirdle)" stroke-width="4" stroke-linecap="round" opacity="0.95"/>
  <!-- Outer Diamond Silhouette -->
  <polygon points="312,318 712,318 814,446 512,762 210,446"
           fill="none" stroke="url(#roseOuter)" stroke-width="7" stroke-linejoin="round"/>
</svg>
